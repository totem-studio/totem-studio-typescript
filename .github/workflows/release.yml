name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      file: ${{ steps.pack.outputs.file }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    permissions:
      # gh release create. This job does not receive an npm identity token.
      contents: write
    env:
      # The README's GitHub release download links.
      RELEASE_LINK: 'https://github\.com/[^[:space:])`"]*/releases/download/[^[:space:])`"]*'
    steps:
      # Actions are pinned by full commit SHA; the comment names the release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - run: npm run health
      - name: Check that the tag names the package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Pack the tarball and its SHA-256
        id: pack
        run: |
          file="$(npm pack --ignore-scripts --json | node -e "process.stdout.write(JSON.parse(require('node:fs').readFileSync(0, 'utf8'))[0].filename)")"
          sha256sum "$file" > "$file.sha256"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d ' ' -f 1 "$file.sha256")" >> "$GITHUB_OUTPUT"
      - name: Check that the README installs this release's files
        env:
          FILE: ${{ steps.pack.outputs.file }}
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          links="$(grep -oE "$RELEASE_LINK" README.md | sort -u)"
          printf '%s\n' "$links" | grep -qxF "$base/$FILE" || { echo "::error::README.md does not install $base/$FILE"; exit 1; }
          for link in $links; do
            case "$link" in
              "$base/$FILE" | "$base/$FILE.sha256") ;;
              *) echo "::error::README.md links another release file: $link"; exit 1 ;;
            esac
          done
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FILE: ${{ steps.pack.outputs.file }}
          SHA256: ${{ steps.pack.outputs.sha256 }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$FILE"
          {
            printf 'Download the tarball and its checksum, check it, then install the file you checked:\n\n```sh\n'
            printf 'curl -fLO %s\ncurl -fLO %s.sha256\nshasum -a 256 -c %s.sha256\nnpm install ./%s\n```\n\n' "$url" "$url" "$FILE" "$FILE"
            printf 'SHA-256 of `%s`: `%s`\n\nSee CHANGELOG.md for the changes in this release.\n' "$FILE" "$SHA256"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "$FILE" "$FILE.sha256" $prerelease --title "$GITHUB_REF_NAME" --notes-file notes.md
      - name: Check that the README's release links resolve
        run: |
          for link in $(grep -oE "$RELEASE_LINK" README.md | sort -u); do
            curl -fsSIL --retry 5 --retry-delay 3 --retry-all-errors -o /dev/null "$link" || { echo "::error::$link does not resolve"; exit 1; }
          done
  npm_publish:
    needs: release
    if: github.repository == 'totem-studio/totem-studio-typescript'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
      - name: Require an npm version supporting trusted publishing
        run: |
          node -e 'const v=process.argv[1].match(/^(\d+)\.(\d+)\.(\d+)$/);if(!v)process.exit(1);const [a,b,c]=v.slice(1).map(Number);if(a<11||a===11&&b<5||a===11&&b===5&&c<1)process.exit(1)' "$(npm --version)"
      - name: Download and verify the exact release tarball
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FILE: ${{ needs.release.outputs.file }}
          SHA256: ${{ needs.release.outputs.sha256 }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern "$FILE"
          printf '%s  %s\n' "$SHA256" "$FILE" | sha256sum -c -
      - name: Publish the verified tarball using npm trusted publishing
        env:
          FILE: ${{ needs.release.outputs.file }}
        run: |
          tag=latest
          case "$GITHUB_REF_NAME" in *-rc.*) tag=rc ;; *-*) tag=beta ;; esac
          npm publish "$FILE" --provenance --access public --tag "$tag" --ignore-scripts
